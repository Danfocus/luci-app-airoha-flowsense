name: Notify Nokia Feed

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Feed Update
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FEED_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Danfocus/openwrt-nokia-feed/dispatches \
            -d '{"event_type":"flowsense_updated","client_payload":{"ref":"${{ github.ref_name }}","sha":"${{ github.sha }}"}}'
